[package]
name = "playlists"
version = "0.2.0"
edition = "2021"
description = "M3u8 playlist and ring buffers"
license = "MIT"
repository = "https://github.com/wavey-ai/playlists"
readme = "README.md"

[features]
default = []
mesh = ["dep:raptorq-datagram-fec", "dep:raptorq", "dep:socket2", "dep:libc"]
# Compact relay objects (slim audio envelopes and RLC1 datagrams).
compact-object = ["dep:media-object"]

[dependencies]
arc-swap = "1.7"
bytes = "1.6.0"
chrono = "0.4.38"
flate2 = "1.0.28"
raptorq-datagram-fec = { version = "0.1.6", optional = true }
raptorq = { version = "2.0.1", optional = true }
media-object = { version = "0.1.1", optional = true }
libc = { version = "0.2", optional = true }
socket2 = { version = "0.6", optional = true }
xxhash-rust = { version = "0.8.10", features = ["xxh3", "const_xxh3"] }
tls-helpers = "0.2.0"
tracing = "0.1.40"
thiserror = "1.0.64"
tokio = { version = "1.43.1", features = ["full"] }
access-unit = { git = "https://github.com/wavey-ai/access-unit.git" }

[dev-dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bench]]
name = "distribution_capacity"
harness = false

[[bench]]
name = "chunk_workloads"
harness = false

[[bench]]
name = "playlist_cache"
harness = false

[[bench]]
name = "playlist_writes"
harness = false

[[bench]]
name = "mesh_pipeline"
harness = false
required-features = ["mesh"]

# RaptorQ coding is orders of magnitude slower without optimisation: a 300-byte
# part took about 12 ms to encode in a debug build. Optimise it in test and
# dev builds so that the timing tests of the cache mesh measure the mesh.
[profile.dev.package.raptorq]
opt-level = 3
